<style>
  :root {

  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#10161d; --card:#171f28; --ink:#e6eaee; --muted:#93a1ae; --faint:#6d7b88;
      --line:#2a343f; --accent:#d9826f; --accent-soft:#33211d; --tier:#1d2733;
      --c1:#d9826f; --c2:#5fa8c9; --c3:#5fbf8f; --c4:#d4b45e; --c5:#a58ad4; --c6:#d989b4; --c7:#7fb89a; --c8:#93a1ae; }
  }
  :root[data-theme="dark"] {
    --paper:#10161d; --card:#171f28; --ink:#e6eaee; --muted:#93a1ae; --faint:#6d7b88;
    --line:#2a343f; --accent:#d9826f; --accent-soft:#33211d; --tier:#1d2733;
    --c1:#d9826f; --c2:#5fa8c9; --c3:#5fbf8f; --c4:#d4b45e; --c5:#a58ad4; --c6:#d989b4; --c7:#7fb89a; --c8:#93a1ae;
  }
  :root[data-theme="light"] {
    --paper:#f6f7f8; --card:#ffffff; --ink:#1a2430; --muted:#5b6b7a; --faint:#8a97a3;
    --line:#dde2e7; --accent:#9a3324; --accent-soft:#f3e4e1; --tier:#eef1f3;
    --c1:#9a3324; --c2:#1e6b8c; --c3:#2e8b57; --c4:#8a6d1f; --c5:#6b4d9e; --c6:#b0578a; --c7:#3f7a5e; --c8:#7d8b98;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:1.45; }
  header { position:sticky; top:0; z-index:10; background:var(--paper); border-bottom:1px solid var(--line);
    padding:14px 20px 10px; }
  .hrow { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; }
  h1 { font-family:Palatino,"Palatino Linotype",Georgia,serif; font-size:20px; font-weight:600; margin:0; }
  .stats { font-size:12px; color:var(--muted); }
  input#q { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:6px 12px; font-size:13px; width:240px; }
  #selbar { display:none; margin-top:8px; background:var(--accent-soft); border-left:3px solid var(--accent);
    padding:8px 12px; font-size:12.5px; border-radius:0 6px 6px 0; }
  #selbar b { color:var(--accent); }
  #selbar .x { cursor:pointer; float:right; color:var(--muted); font-weight:600; padding:0 4px; }
  #selbar .coinv { color:var(--muted); }
  #selbar .coinv span { cursor:pointer; text-decoration:underline dotted; }

  .layout { display:grid; grid-template-columns:250px 1fr; gap:0; }
  aside { border-right:1px solid var(--line); padding:12px 8px 40px 16px; position:sticky; top:64px;
    height:calc(100vh - 64px); overflow-y:auto; }
  aside h2 { font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin:4px 0 8px; }
  .inv { display:flex; justify-content:space-between; gap:6px; padding:3px 8px; border-radius:6px;
    font-size:12.5px; cursor:pointer; color:var(--ink); }
  .inv:hover { background:var(--tier); }
  .inv.on { background:var(--accent); color:#fff; }
  .inv .n { color:var(--faint); font-variant-numeric:tabular-nums; }
  .inv.on .n { color:#fff; }

  main { padding:14px 20px 80px; min-width:0; }
  section { margin-bottom:6px; }
  h3 { font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); font-weight:600;
    margin:18px 0 8px; display:flex; align-items:center; gap:10px; }
  h3 .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  h3 .cnt { color:var(--faint); font-weight:400; letter-spacing:0; }
  h3::after { content:""; flex:1; height:1px; background:var(--line); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:6px; }
  .card { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--line);
    padding:7px 10px; font-size:12.5px; line-height:1.35; cursor:pointer; }
  .card b { font-size:13px; }
  .card .st { color:var(--accent); font-size:10.5px; font-family:ui-monospace,Menlo,monospace; margin-left:6px; }
  .card em { display:block; font-style:normal; color:var(--muted); font-size:11.5px; margin-top:1px; }
  .card .invs { display:none; margin-top:5px; padding-top:5px; border-top:1px dashed var(--line); }
  .card.open .invs { display:block; }
  .card .invs span { display:inline-block; background:var(--tier); border-radius:999px; padding:1px 8px;
    margin:1px 2px 1px 0; font-size:11px; cursor:pointer; }
  .card .invs span:hover { background:var(--accent); color:#fff; }
  .card.hot { border-left-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .dimmed .card:not(.hot) { opacity:0.25; }
  .hidden { display:none !important; }
  @media (max-width:760px){ .layout { grid-template-columns:1fr; } aside { position:static; height:auto; max-height:220px; border-right:none; border-bottom:1px solid var(--line);} }

  /* ---- disclosure kit: shared across all appetite-probe pages ---- */
  .dmark{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;
    background:var(--tier,var(--line));color:var(--muted);font:600 9px/1 ui-monospace,monospace;
    cursor:help;border:none;padding:0;margin-left:5px;vertical-align:middle;position:relative}
  .dmark:hover,.dmark:focus-visible,.dmark.open{background:var(--accent,#9a3324);color:#fff;outline:none}
  .dmark .dpop{display:none;position:absolute;z-index:30;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);
    width:max-content;max-width:250px;background:var(--ink);color:var(--paper,var(--card));font-size:11.5px;line-height:1.45;
    padding:8px 11px;border-radius:7px;box-shadow:0 6px 18px rgba(0,0,0,.22);text-align:left;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:400}
  .dmark.open > .dpop{display:block}
  .dpop::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink)}
  .dpop.below{bottom:auto;top:calc(100% + 7px)}
  .dpop.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--ink)}
  details.mnote{margin:10px 0 22px}
  details.mnote summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;list-style:none;
    display:flex;align-items:center;gap:6px;user-select:none}
  details.mnote summary::before{content:"▸";font-size:9px;color:var(--faint);transition:transform .15s;display:inline-block}
  details.mnote[open] summary::before{transform:rotate(90deg)}
  details.mnote summary::-webkit-details-marker{display:none}
  details.mnote .mnote-body{color:var(--muted);font-size:12.5px;padding:8px 2px 0 15px;max-width:72ch;line-height:1.55}
</style>

const GROUPS = [
  ["broker-ops","Broker ops","--c1"],
  ["mga-uw","MGA & underwriting ops","--c2"],
  ["risk-pricing","Risk data & pricing","--c3"],
  ["bind-service","Bind, service & compliance","--c4"],
  ["claims","Claims","--c5"],
  ["distribution","Distribution & embedded","--c6"],
  ["full-stack","Full-stack insurers","--c7"],
  ["other","Other","--c8"],
];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const companies = DATA.companies, invCounts = DATA.invCounts;
const portfolio = {}; // investor -> [company names]
companies.forEach(c => c.investors.forEach(i => (portfolio[i]=portfolio[i]||[]).push(c.name)));

// build investor rail (>=2 deals)
const invSorted = Object.entries(invCounts).filter(e=>e[1]>=2).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
const invlist = document.getElementById('invlist');
invSorted.forEach(([name,n])=>{
  const d=document.createElement('div'); d.className='inv'; d.dataset.inv=name;
  d.innerHTML=`<span>${name}</span><span class="n">${n}</span>`;
  d.onclick=()=>selectInv(sel===name?null:name);
  invlist.appendChild(d);
});

// build cluster sections
const main = document.getElementById('main');
const cardEls = {};
GROUPS.forEach(g=>{
  const cos = companies.filter(c=>c.g===g[0]).sort((a,b)=>b.investors.length-a.investors.length||a.name.localeCompare(b.name));
  if (!cos.length) return;
  const sec=document.createElement('section');
  sec.innerHTML=`<h3><span class="dot" style="background:${css(g[2])}"></span>${g[1]} <span class="cnt">· ${cos.length}</span></h3>`;
  const grid=document.createElement('div'); grid.className='grid';
  cos.forEach(c=>{
    const el=document.createElement('div'); el.className='card'; el.style.borderLeftColor=css(g[2]);
    el.dataset.name=c.name.toLowerCase(); el.dataset.invs=c.investors.join('|').toLowerCase();
    el.innerHTML=`<b>${c.name}</b><span class="st">${c.stage||''}</span><em>${c.what||''}</em>
      <div class="invs">${c.investors.map(i=>`<span data-i="${i}">${i}</span>`).join('')||'<i style="color:var(--faint)">no investors recorded</i>'}</div>`;
    el.onclick=e=>{
      const chip=e.target.closest('span[data-i]');
      if (chip){ selectInv(chip.dataset.i); e.stopPropagation(); return; }
      el.classList.toggle('open');
    };
    grid.appendChild(el);
    (cardEls[c.name]=el);
  });
  sec.appendChild(grid); main.appendChild(sec);
});

// selection
let sel=null;
const selbar=document.getElementById('selbar');
function selectInv(name){
  sel=name;
  document.querySelectorAll('.inv').forEach(d=>d.classList.toggle('on', d.dataset.inv===name));
  const port = name ? new Set(portfolio[name]||[]) : null;
  document.body.classList.toggle('dimmed', !!name);
  Object.entries(cardEls).forEach(([cn,el])=>el.classList.toggle('hot', !!(port&&port.has(cn))));
  if (!name){ selbar.style.display='none'; return; }
  // co-investors: investors sharing >=1 company
  const co={};
  (portfolio[name]||[]).forEach(cn=>{
    const c=companies.find(x=>x.name===cn);
    c.investors.forEach(i=>{ if (i!==name && invCounts[i]>=2) co[i]=(co[i]||0)+1; });
  });
  const cotop=Object.entries(co).sort((a,b)=>b[1]-a[1]).slice(0,8);
  selbar.style.display='block';
  selbar.innerHTML=`<span class="x" title="clear">✕</span><b>${name}</b> — ${port.size} compan${port.size===1?'y':'ies'} highlighted: ${[...port].join(', ')}.
    ${cotop.length?`<div class="coinv">Frequent co-investors (next to explore): ${cotop.map(e=>`<span data-i="${e[0]}">${e[0]}</span> (${e[1]})`).join(' · ')}</div>`:''}`;
  selbar.querySelector('.x').onclick=()=>selectInv(null);
  selbar.querySelectorAll('.coinv span').forEach(s=>s.onclick=()=>selectInv(s.dataset.i));
}
// search
document.getElementById('q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  Object.values(cardEls).forEach(el=>{
    el.classList.toggle('hidden', !!q && !el.dataset.name.includes(q) && !el.dataset.invs.includes(q));
  });
  document.querySelectorAll('.inv').forEach(d=>{
    d.classList.toggle('hidden', !!q && !d.dataset.inv.toLowerCase().includes(q));
  });
  document.querySelectorAll('main section').forEach(s=>{
    s.classList.toggle('hidden', !!q && !s.querySelector('.card:not(.hidden)'));
  });
});
document.getElementById('stats').innerHTML =
  `${companies.length} startups · ${invSorted.length} investors with 2+ deals · click an investor to light up its portfolio · click a card for its investors
  <button class="dmark" aria-label="methodology">i<span class="dpop below">Built by a two-phase snowball crawl (seed portfolios + co-investor expansion), then census-audited against ITC Vegas and InsurTech NY/sister-org exhibitor lists. "2+ deals" is the threshold to appear in the investor rail on the left. Last compiled: Sept 2026.</span></button>`;

// ---- disclosure kit: shared click/keyboard behavior for .dmark popovers ----
document.addEventListener('click', e => {
  const m = e.target.closest('.dmark');
  document.querySelectorAll('.dmark.open').forEach(el => { if (el !== m) el.classList.remove('open'); });
  if (m){ m.classList.toggle('open'); e.stopPropagation(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.dmark.open').forEach(el => el.classList.remove('open'));
});
</script>
